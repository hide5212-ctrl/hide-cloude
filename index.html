<title>座席くじ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="座席くじ">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161B" media="(prefers-color-scheme: dark)">
<meta name="description" content="コの字・ロの字・教室など机の並びを選んで、参加者に座席をランダムで割り当てます。特定の人の席は固定できます。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EDEFEA;
  --surface:#FFFFFF;
  --surface-2:#F6F7F3;
  --ink:#161F27;
  --ink-2:#3D4954;
  --muted:#6D7883;
  --line:#D8DCD4;
  --line-2:#C2C8BE;
  --accent:#1E5A7A;
  --accent-2:#12455F;
  --accent-soft:#DEE9EF;
  --pin:#AE4238;
  --pin-soft:#F7E5E2;
  --desk:#CDC3B1;
  --desk-2:#B7AC96;
  --edge-shadow:rgba(22,31,39,.16);
  --shadow-1:0 1px 2px rgba(22,31,39,.07);
  --shadow-2:0 1px 2px rgba(22,31,39,.06), 0 10px 26px -14px rgba(22,31,39,.30);
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11161B;
    --surface:#1A2129;
    --surface-2:#212A33;
    --ink:#E8ECEF;
    --ink-2:#C2CBD3;
    --muted:#93A0AB;
    --line:#2B343D;
    --line-2:#3A4550;
    --accent:#79B6D4;
    --accent-2:#A7D2E7;
    --accent-soft:#1C3241;
    --pin:#E48B81;
    --pin-soft:#3A2320;
    --desk:#3B372F;
    --desk-2:#4E4939;
    --edge-shadow:rgba(0,0,0,.55);
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11161B;
  --surface:#1A2129;
  --surface-2:#212A33;
  --ink:#E8ECEF;
  --ink-2:#C2CBD3;
  --muted:#93A0AB;
  --line:#2B343D;
  --line-2:#3A4550;
  --accent:#79B6D4;
  --accent-2:#A7D2E7;
  --accent-soft:#1C3241;
  --pin:#E48B81;
  --pin-soft:#3A2320;
  --desk:#3B372F;
  --desk-2:#4E4939;
  --edge-shadow:rgba(0,0,0,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{
  max-width:1280px;margin:0 auto;
  padding:calc(28px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
          calc(64px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
}

/* ---------- header ---------- */
.masthead{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;
  padding-bottom:16px;margin-bottom:22px;
  border-bottom:1px solid var(--line);
}
.masthead h1{
  font-family:var(--mincho);font-weight:800;
  font-size:clamp(26px,3.4vw,36px);line-height:1.25;
  margin:0;letter-spacing:.04em;text-wrap:balance;
}
.masthead .lede{margin:0;color:var(--muted);font-size:13.5px;max-width:56ch}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin:0 0 2px
}

/* ---------- stats ---------- */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.stat{
  display:flex;align-items:baseline;gap:7px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:5px 14px;box-shadow:var(--shadow-1);
}
.stat b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.stat.is-pin b{color:var(--pin)}
.stat.is-empty b{color:var(--muted)}

/* ---------- layout ---------- */
.layout{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
/* 幅の判定は @media ではなく :root[data-w] で行う。理由は下の起動処理を参照 */
:root[data-w="wide"] .layout{grid-template-columns:minmax(0,1fr) 348px;align-items:start}
:root[data-w="wide"] .plan{order:1}
:root[data-w="wide"] .panel{order:2;position:sticky;top:20px}

.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow-2);
  min-width:0;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.card-head h2{
  font-family:var(--mincho);font-size:17px;font-weight:600;
  margin:0;letter-spacing:.06em;
}
.card-head .hint{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}

/* ---------- room（見取り図） ---------- */
/* 中身はレイアウトごとに JS が組み立てる。ここは全レイアウト共通の見た目 */
.room-scroll{
  overflow-x:auto;padding:26px 18px 18px;
  /* 端の影は中身がはみ出しているときだけ出る（background-attachment のふるまいを利用） */
  background:
    linear-gradient(to right, var(--surface) 40%, transparent) left center/34px 100% no-repeat local,
    linear-gradient(to left,  var(--surface) 40%, transparent) right center/34px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, var(--edge-shadow), transparent) left center/12px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, var(--edge-shadow), transparent) right center/12px 100% no-repeat scroll;
}
.room{
  --seat-w:118px;  --seat-h:78px;   /* コの字・ロの字の上下辺 */
  --side-w:132px;  --side-h:70px;   /* コの字・ロの字の左右辺 */
  --cell-w:106px;  --cell-h:66px;   /* 対面・教室・島型 */
  --seat-name:15px; --seat-no:10.5px;
  --desk-thickness:36px;
  --seat-gap:10px;
  --side-pad:12px;
  display:flex;flex-direction:column;align-items:center;gap:0;
  /* 中身が広ければその幅を持ち（枠内で横スクロール）、狭ければ枠いっぱいで中央に置く */
  width:max-content;min-width:100%;margin:0 auto;
}
.room-top{display:flex;justify-content:center;margin-bottom:10px}
.room-bottom{
  width:100%;margin-top:16px;border-top:2px solid var(--line-2);
  padding-top:8px;text-align:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);
}
.room-stamp{
  margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
}
.badge-kamiza{
  display:inline-block;font-family:var(--mincho);font-size:11px;letter-spacing:.3em;
  color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:2px 14px 2px 18px;
}
.board{
  width:100%;min-width:280px;
  background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:8px;padding:9px 14px;text-align:center;
  font-family:var(--mincho);font-size:12px;letter-spacing:.28em;color:var(--accent-2);
}

/* 枠に入りきらないときは、はみ出す代わりに全体を縮めて収める */
.room-fit{position:relative}
.room-fit.is-scaled .room{position:absolute;top:0;left:0}

/* 机 */
.desk{background-color:var(--desk);border:1px solid var(--desk-2);position:relative}
.desk.grain-h{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 9px)}
.desk.grain-v{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 9px)}
.side-tag{
  position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--muted);white-space:nowrap;
}
.side-tag.tag-h{top:50%;left:10px;transform:translateY(-50%)}
.side-tag.tag-v{top:10px;left:50%;transform:translateX(-50%) rotate(90deg)}

/* ロの字・コの字 */
.ring{display:grid;grid-template-columns:auto auto minmax(52px,1fr) auto auto}
.seats-row{display:flex;justify-content:center;gap:var(--seat-gap)}
.seats-col{display:flex;flex-direction:column;gap:var(--seat-gap)}
.court{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:14px;padding:16px 10px;min-width:110px;
  border:1px dashed var(--line-2);border-radius:10px;text-align:center;
}
.court-label{font-family:var(--mincho);font-size:13px;letter-spacing:.3em;color:var(--muted)}

/* 対面（長机の両側） */
.facing{display:grid;align-items:center}

/* 教室（スクール形式） */
.school{display:grid;gap:14px 12px;margin-top:14px}
.desk-unit{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.desk-bar{width:100%;height:10px;border-radius:0 0 5px 5px;border-top:none}

/* 島型（グループ） */
.islands{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 30px;margin-top:14px}
.island{display:flex;flex-direction:column;align-items:center;gap:8px}
.island-name{
  font-family:var(--mincho);font-size:12px;letter-spacing:.24em;color:var(--muted);
}
.island-desk{width:100%;height:30px;border-radius:8px}

/* ---------- seat ---------- */
.seat{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:inherit;color:var(--ink);text-align:center;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;
  box-shadow:var(--shadow-1);
  padding:8px 6px;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
}
.seat.s-tall{width:var(--seat-w);height:var(--seat-h)}
.seat.s-wide{width:var(--side-w);height:var(--side-h)}
.seat.s-cell{width:var(--cell-w);height:var(--cell-h)}
:root:not([data-touch="1"]) .seat:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--accent)}
.seat:active{transform:scale(.97)}
.seat .no{
  font-family:var(--mono);font-size:var(--seat-no);letter-spacing:.1em;color:var(--muted);
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.seat .who{
  font-weight:700;font-size:var(--seat-name);line-height:1.3;letter-spacing:.02em;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.seat.is-empty{background:transparent;border-style:dashed;box-shadow:none}
.seat.is-empty .who{color:var(--muted);font-weight:500}
.seat.is-pinned{
  background:var(--pin-soft);border-color:var(--pin);
  box-shadow:var(--shadow-1),inset 0 0 0 1px var(--pin);
}
.seat.is-pinned .no{color:var(--pin)}
.seat .pin-mark{
  position:absolute;top:-8px;right:-6px;
  font-size:10px;font-weight:700;letter-spacing:.08em;
  background:var(--pin);color:var(--surface);border-radius:999px;padding:1px 7px;
  box-shadow:var(--shadow-1);
}
.seat.is-rolling .who{opacity:.55}
.seat.is-landed{animation:land .34s cubic-bezier(.2,.9,.3,1.4)}
@keyframes land{
  0%{transform:scale(.9) translateY(4px);opacity:.4}
  60%{transform:scale(1.05) translateY(0);opacity:1}
  100%{transform:scale(1)}
}
@media (prefers-reduced-motion: reduce){
  .seat,.seat:hover{transition:none;transform:none}
  .seat.is-landed{animation:none}
}
.badge-kamiza{
  display:inline-block;font-family:var(--mincho);font-size:11px;letter-spacing:.3em;
  color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:2px 14px 2px 18px;margin-bottom:10px;
}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;gap:16px}
.field{padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.field > label,.legend{
  font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-2);
}
.sub{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0}
.sub-actions{margin-top:2px}
textarea,input,select{
  font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;width:100%;
  -webkit-appearance:none;appearance:none;
}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px;
}
textarea{min-height:216px;resize:vertical;line-height:1.9}
select{cursor:pointer}
input[type=number]{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sides label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);text-align:center}

.pin-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}
.pin-row select{padding:8px 8px;min-width:0}
.pin-list{display:flex;flex-direction:column;gap:8px}
.pin-empty{font-size:12px;color:var(--muted);margin:0}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent}
.btn{
  min-height:40px;padding:8px 14px;background:var(--surface-2);border-color:var(--line-2);color:var(--ink);
  font-size:13.5px;font-weight:500;transition:background .15s ease,border-color .15s ease;
}
:root:not([data-touch="1"]) .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
:root:not([data-touch="1"]) .btn-icon:hover{color:var(--pin);border-color:var(--pin);background:var(--pin-soft)}
:root:not([data-touch="1"]) .btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:active,.btn-primary:active{filter:brightness(.93)}
.btn-icon{padding:6px 10px;font-size:12px;color:var(--muted)}
.btn-primary{
  background:var(--accent);color:var(--surface);border-color:var(--accent);
  font-weight:700;font-size:15px;padding:11px 22px;letter-spacing:.14em;
  box-shadow:var(--shadow-2);
}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.notice{
  margin:0;padding:9px 14px;border-radius:8px;font-size:12.5px;
  background:var(--accent-soft);color:var(--accent-2);border:1px solid transparent;
}
.notice:empty{display:none}
.notice.is-error{background:var(--pin-soft);color:var(--pin);border-color:var(--pin)}

.actionbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.actionbar .spacer{flex:1}

.legend-list{
  display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0 18px 16px;
  list-style:none;font-size:11.5px;color:var(--muted);
}
.legend-list b{color:var(--ink-2);font-weight:700}

/* ---------- 表示切替 ---------- */
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:2px;gap:2px}
.seg{
  min-height:34px;padding:5px 13px;border-radius:7px;border:none;background:transparent;
  color:var(--muted);font-size:13px;font-weight:500;-webkit-tap-highlight-color:transparent;
}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow-1)}

:root[data-touch="1"] .btn{min-height:44px}
:root[data-touch="1"] .seg{min-height:42px}
:root[data-touch="1"] .btn-icon{min-height:44px;padding:8px 12px}
:root[data-touch="1"] .seat-row{min-height:58px}
:root[data-touch="1"] .stat{padding:6px 14px}

/* ---------- 席順リスト ---------- */
.roster{padding:6px 0 4px}
.roster[hidden],.room-scroll[hidden]{display:none}
.roster-group{
  display:flex;align-items:center;gap:9px;
  padding:14px 18px 6px;font-size:11px;font-family:var(--mono);
  letter-spacing:.18em;color:var(--muted);
}
.roster-group::after{content:"";flex:1;height:1px;background:var(--line)}
.seat-row{
  display:grid;grid-template-columns:38px 58px 1fr auto;align-items:center;gap:10px;
  width:100%;padding:11px 18px;min-height:52px;
  background:transparent;border:none;border-top:1px solid var(--line);
  text-align:left;color:var(--ink);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
.roster-group + .seat-row{border-top:none}
.seat-row .no{
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
  color:var(--muted);letter-spacing:.04em;
}
.seat-row .side{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.seat-row .who{font-size:16px;font-weight:700;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat-row.is-empty .who{color:var(--muted);font-weight:400}
.seat-row.is-pinned{background:var(--pin-soft)}
.seat-row.is-pinned .no{color:var(--pin)}
.seat-row .pin-mark{
  position:static;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  background:var(--pin);color:var(--surface);border-radius:999px;padding:2px 9px;
}
.seat-row:active{background:var(--accent-soft)}
.seat-row.is-rolling .who{opacity:.55}
.seat-row.is-landed{animation:rowland .3s ease}
@keyframes rowland{from{opacity:.35;transform:translateX(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.seat-row.is-landed{animation:none}}

/* ---------- タブレット / スマートフォン ---------- */
:root:not([data-w="wide"]) .actionbar{
  position:sticky;top:0;z-index:20;
  background:var(--surface);border-radius:14px 14px 0 0;
}
:root[data-w="narrow"] .wrap{padding-top:calc(18px + env(safe-area-inset-top))}
:root[data-w="narrow"] .masthead{gap:2px;padding-bottom:8px;margin-bottom:10px}
:root[data-w="narrow"] .masthead h1{font-size:21px;letter-spacing:.02em}
:root[data-w="narrow"] .eyebrow{display:none}
:root[data-w="narrow"] .masthead .lede{font-size:13px}
:root[data-w="narrow"] .layout{gap:16px}
:root[data-w="narrow"] .ring{grid-template-columns:auto auto minmax(40px,1fr) auto auto}
:root[data-w="narrow"] .room{
  --seat-w:52px;  --seat-h:56px;
  --side-w:58px;  --side-h:56px;
  --cell-w:54px;  --cell-h:56px;
  --seat-name:11.5px; --seat-no:8.5px;
  --desk-thickness:14px; --seat-gap:3px; --side-pad:5px;
}
/* 狭い席では名前を2行まで折り返して、削らずに読めるようにする */
:root[data-w="narrow"] .seat{padding:5px 3px}
:root[data-w="narrow"] .seat .who{
  white-space:normal;line-height:1.2;letter-spacing:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  text-overflow:clip;
}
/* 「固定」の帯は席に対して大きすぎるので、点で示す */
:root[data-w="narrow"] .seat .pin-mark{
  font-size:0;width:9px;height:9px;padding:0;top:-3px;right:-3px;

<script>
// このページは「ブラウザから渡された幅」でレイアウトを決める。
// ところが次の場合、iPhone でも幅が PC 並みに報告されてしまう。
//   ・Safari の「デスクトップ用Webサイトを表示」が有効
//   ・別サイトの表示枠（iframe）の中に埋め込まれている
// そこで描画幅だけでなく端末の画面幅も見て、小さいほうを採用する。
(function () {
  function effectiveWidth() {
    var frame = document.documentElement.clientWidth || window.innerWidth || 1024;
    var device = (window.screen && window.screen.width) ? window.screen.width : frame;
    return Math.min(frame, device);
  }
  function apply() {
    var w = effectiveWidth();
    var root = document.documentElement;
    root.setAttribute("data-w", w < 761 ? "narrow" : (w < 1000 ? "mid" : "wide"));
    if (navigator.maxTouchPoints > 0) root.setAttribute("data-touch", "1");
    else root.removeAttribute("data-touch");
    return w;
  }
  window.__effectiveWidth = effectiveWidth;
  window.__applyWidth = apply;
  apply();
  window.addEventListener("resize", apply);
  window.addEventListener("orientationchange", apply);
})();
</script>

<script>
(function(){
  "use strict";

  var STORE = "konoji-seat-v1";
  // ポインタが指なら「タップ」、マウスなら「クリック」と案内する
  var TAP = (navigator.maxTouchPoints > 0) ? "タップ" : "クリック";
  // 参加者の初期値は空。使う人が自分の名簿を貼り付けるところから始める
  // cfg は全レイアウト分の設定をまとめて持つ。並びを変えても前の数値が残る
  var DEFAULT_CFG = {
    top:4, left:5, right:5,                 // コの字
    rTop:4, rRight:3, rBottom:4, rLeft:3,   // ロの字
    fPerSide:7, fEnds:0,                    // 対面
    sCols:5, sRows:3,                       // 教室
    iCount:4, iPerIsland:4                  // 島型
  };
  function freshCfg(){
    var c = {};
    for (var k in DEFAULT_CFG) if (DEFAULT_CFG.hasOwnProperty(k)) c[k] = DEFAULT_CFG[k];
    return c;
  }

  var state = {
    names: [],
    layout: "konoji",
    cfg: freshCfg(),
    pins: {},          // 名前 -> 席インデックス
    assign: [],        // 席インデックス -> 名前 or null
    drawnAt: null,
    // 画面が狭いときは既定を「席順リスト」にする（コの字は横に広く、iPhone の縦画面に収まらないため）
    view: defaultView(),
    // 利用者が自分で切り替えたら、以後は画面幅で上書きしない
    viewChosen: false
  };

  var el = {
    names: document.getElementById("names"),
    nameCount: document.getElementById("nameCount"),
    seatCount: document.getElementById("seatCount"),
    pinList: document.getElementById("pinList"),
    addPin: document.getElementById("addPinBtn"),
    layoutSelect: document.getElementById("layoutSelect"),
    layoutNote: document.getElementById("layoutNote"),
    cfgFields: document.getElementById("cfgFields"),
    orderNote: document.getElementById("orderNote"),
    seatsTop: document.getElementById("seatsTop"),
    seatsLeft: document.getElementById("seatsLeft"),
    seatsRight: document.getElementById("seatsRight"),
    room: document.getElementById("room"),
    roomScroll: document.getElementById("roomScroll"),
    roomFit: document.getElementById("roomFit"),
    roster: document.getElementById("roster"),
    plan: document.getElementById("plan"),
    viewMap: document.getElementById("viewMap"),
    viewList: document.getElementById("viewList"),
    drawBtn: document.getElementById("drawBtn"),
    copyBtn: document.getElementById("copyBtn"),
    printBtn: document.getElementById("printBtn"),
    clearSeatsBtn: document.getElementById("clearSeatsBtn"),
    clearAllBtn: document.getElementById("clearAllBtn"),
    notice: document.getElementById("notice"),
    statSeats: document.getElementById("statSeats"),
    statPeople: document.getElementById("statPeople"),
    statPins: document.getElementById("statPins"),
    statEmpty: document.getElementById("statEmpty")
  };

  /* ---------- 席の並び（レイアウト） ---------- */
  // 各レイアウトは「席数」「席の呼び名」「見取り図の描き方」だけを受け持つ。
  // 席番号は必ず 0..席数-1 の連番で、抽選も固定もこの番号しか見ていないため、
  // 並びを増やしても抽選まわりのコードは触らなくてよい。

  function elem(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function place(node, r1, c1, r2, c2){
    node.style.gridArea = r1 + " / " + c1 + " / " + r2 + " / " + c2;
    return node;
  }
  function range(from, count){
    var a = [];
    for (var i = 0; i < count; i++) a.push(from + i);
    return a;
  }

  var LAYOUTS = {
    konoji: {
      name: "コの字",
      note: "三方を机で囲み、開いた側に screen や入口を置く並び。会議や研修でよく使います。",
      order: "席番号は入口側の左から時計回り（左辺 → 上辺 → 右辺）",
      topBar: {kind:"badge", text:"上座"},
      bottomBar: "スクリーン ／ 入口",
      fields: [
        {key:"top",   label:"上辺", min:0, max:12},
        {key:"left",  label:"左辺", min:0, max:12},
        {key:"right", label:"右辺", min:0, max:12}
      ],
      total: function(c){ return c.left + c.top + c.right; },
      seatInfo: function(c, i){
        if (i < c.left) return {group:"左辺", pos:c.left - i};
        if (i < c.left + c.top) return {group:"上辺", pos:i - c.left + 1};
        return {group:"右辺", pos:i - c.left - c.top + 1};
      },
      render: function(root, c){
        renderRing(root, {
          left:  range(0, c.left),
          top:   range(c.left, c.top),
          right: range(c.left + c.top, c.right),
          bottom: null
        });
      }
    },

    roji: {
      name: "ロの字",
      note: "四方を机で囲む並び。全員が中心を向くので、討論や少人数の会議に向きます。",
      order: "席番号は入口側の左から時計回り（左辺 → 上辺 → 右辺 → 下辺）",
      topBar: {kind:"badge", text:"上座"},
      bottomBar: "入口",
      fields: [
        {key:"rTop",    label:"上辺", min:0, max:12},
        {key:"rRight",  label:"右辺", min:0, max:12},
        {key:"rBottom", label:"下辺", min:0, max:12},
        {key:"rLeft",   label:"左辺", min:0, max:12}
      ],
      total: function(c){ return c.rLeft + c.rTop + c.rRight + c.rBottom; },
      seatInfo: function(c, i){
        if (i < c.rLeft) return {group:"左辺", pos:c.rLeft - i};
        if (i < c.rLeft + c.rTop) return {group:"上辺", pos:i - c.rLeft + 1};
        if (i < c.rLeft + c.rTop + c.rRight) return {group:"右辺", pos:i - c.rLeft - c.rTop + 1};
        return {group:"下辺", pos:c.rLeft + c.rTop + c.rRight + c.rBottom - i};
      },
      render: function(root, c){
        var a = c.rLeft, b = a + c.rTop, d = b + c.rRight;
        renderRing(root, {
          left:   range(0, c.rLeft),
          top:    range(a, c.rTop),
          right:  range(b, c.rRight),
          // 下辺は右から左へ回ってくるので、描画は逆順にして左から並べる
          bottom: range(d, c.rBottom).reverse()
        });
      }
    },

    facing: {
      name: "対面（長机の両側）",
      note: "四角い長机の両側に向かい合って座る並び。端の席を置くかどうかも選べます。",
      order: "席番号は奥側の左から右へ、続いて手前側の左から右へ、最後に端の席",
      topBar: {kind:"badge", text:"上座（奥側）"},
      bottomBar: "入口",
      fields: [
        {key:"fPerSide", label:"片側の人数", min:1, max:12},
        {key:"fEnds",    label:"端の席（0〜2）", min:0, max:2}
      ],
      total: function(c){ return c.fPerSide * 2 + c.fEnds; },
      seatInfo: function(c, i){
        if (i < c.fPerSide) return {group:"奥側", pos:i + 1};
        if (i < c.fPerSide * 2) return {group:"手前側", pos:i - c.fPerSide + 1};
        return {group:"端", pos:i - c.fPerSide * 2 + 1};
      },
      render: function(root, c){
        var g = elem("div", "facing");
        g.style.gridTemplateColumns = "auto auto auto";
        g.style.gridTemplateRows = "auto auto auto";

        var top = elem("div", "seats-row");
        range(0, c.fPerSide).forEach(function(i){ top.appendChild(seatNode(i, "s-cell")); });
        place(top, 1, 2, 2, 3);
        top.style.marginBottom = "var(--side-pad)";

        var desk = elem("div", "desk grain-h");
        desk.style.height = "var(--desk-thickness)";
        desk.style.borderRadius = "10px";
        place(desk, 2, 2, 3, 3);

        var bottom = elem("div", "seats-row");
        range(c.fPerSide, c.fPerSide).forEach(function(i){ bottom.appendChild(seatNode(i, "s-cell")); });
        place(bottom, 3, 2, 4, 3);
        bottom.style.marginTop = "var(--side-pad)";

        g.appendChild(top); g.appendChild(desk); g.appendChild(bottom);

        // 端の席は机の左右に置く。1席なら左（上座に近い側）だけ
        var endBase = c.fPerSide * 2;
        if (c.fEnds >= 1){
          var l = seatNode(endBase, "s-cell");
          l.style.marginRight = "var(--side-pad)";
          g.appendChild(place(l, 2, 1, 3, 2));
        }
        if (c.fEnds >= 2){
          var r = seatNode(endBase + 1, "s-cell");
          r.style.marginLeft = "var(--side-pad)";
          g.appendChild(place(r, 2, 3, 3, 4));
        }
        root.appendChild(g);
      }
    },

    school: {
      name: "教室（スクール形式）",
      note: "全員が前を向いて並ぶ、授業でおなじみの並び。ひとりに机ひとつです。",
      order: "席番号は前の列の左から右へ、それを後ろの列へ繰り返します",
      topBar: {kind:"bar", text:"黒 板 ・ 教 壇"},
      bottomBar: "出入口（後方）",
      fields: [
        {key:"sCols", label:"横に並ぶ人数", min:1, max:12},
        {key:"sRows", label:"前後の列数",   min:1, max:12}
      ],
      total: function(c){ return c.sCols * c.sRows; },
      seatInfo: function(c, i){
        return {group:"前から" + (Math.floor(i / c.sCols) + 1) + "列目", pos:(i % c.sCols) + 1};
      },
      render: function(root, c){
        var g = elem("div", "school");
        g.style.gridTemplateColumns = "repeat(" + c.sCols + ", auto)";
        for (var i = 0; i < c.sCols * c.sRows; i++){
          var unit = elem("div", "desk-unit");
          unit.appendChild(seatNode(i, "s-cell"));
          var bar = elem("div", "desk desk-bar grain-h");
          unit.appendChild(bar);
          g.appendChild(unit);
        }
        root.appendChild(g);
      }
    },

    island: {
      name: "島型（グループ）",
      fit: "wrap",   // 島は横に並べきれなければ折り返す
      note: "四角い机を囲む小さな島をいくつか作る並び。グループワークや懇親会に向きます。",
      order: "席番号は A 島から順に、島ごとに奥側の左から時計回り",
      topBar: {kind:"bar", text:"前 方 （ 黒 板 ）"},
      bottomBar: "出入口（後方）",
      fields: [
        {key:"iCount",     label:"島の数",     min:1, max:8},
        {key:"iPerIsland", label:"1島の人数", min:2, max:10}
      ],
      total: function(c){ return c.iCount * c.iPerIsland; },
      seatInfo: function(c, i){
        var island = Math.floor(i / c.iPerIsland);
        return {group:islandName(island) + "島", pos:(i % c.iPerIsland) + 1};
      },
      render: function(root, c){
        var wrap = elem("div", "islands");
        for (var k = 0; k < c.iCount; k++){
          var base = k * c.iPerIsland;
          var half = Math.ceil(c.iPerIsland / 2);

          var island = elem("div", "island");
          island.appendChild(elem("div", "island-name", islandName(k) + "島"));

          var top = elem("div", "seats-row");
          range(base, half).forEach(function(i){ top.appendChild(seatNode(i, "s-cell")); });
          island.appendChild(top);

          var desk = elem("div", "desk island-desk grain-h");
          island.appendChild(desk);

          var bottom = elem("div", "seats-row");
          // 手前側は奥側と向かい合うよう、番号の大きいほうから並べる
          range(base + half, c.iPerIsland - half).reverse()
            .forEach(function(i){ bottom.appendChild(seatNode(i, "s-cell")); });
          island.appendChild(bottom);

          wrap.appendChild(island);
        }
        root.appendChild(wrap);
      }
    }
  };

  function islandName(index){
    var letters = "ABCDEFGH";
    return index < letters.length ? letters.charAt(index) : String(index + 1);
  }

  function layout(){ return LAYOUTS[state.layout] || LAYOUTS.konoji; }
  function total(){ return Math.max(0, layout().total(state.cfg)); }
  function seatSide(i){ return layout().seatInfo(state.cfg, i); }
  function seatNo(i){ return String(i+1).padStart(2,"0"); }
  function seatLabel(i){ var s = seatSide(i); return "席" + seatNo(i) + "（" + s.group + s.pos + "）"; }

  // コの字（bottom なし）とロの字（bottom あり）を同じ組み立てで描く
  function renderRing(root, sides){
    var closed = !!(sides.bottom && sides.bottom.length);
    var g = elem("div", "ring");
    g.style.gridTemplateRows = closed ? "auto auto 1fr auto auto" : "auto auto 1fr";

    var thickness = "var(--desk-thickness)";

    var top = elem("div", "seats-row");
    sides.top.forEach(function(i){ top.appendChild(seatNode(i, "s-tall")); });
    top.style.paddingBottom = "var(--side-pad)";
    g.appendChild(place(top, 1, 2, 2, 5));

    var deskTop = elem("div", "desk grain-h");
    deskTop.style.height = thickness;
    deskTop.style.borderRadius = "10px 10px 0 0";
    deskTop.style.borderBottom = "none";
    deskTop.appendChild(elem("span", "side-tag tag-h", "上辺"));
    g.appendChild(place(deskTop, 2, 2, 3, 5));

    // 左辺は奥（上座寄り）が上に見えるよう逆順に並べる
    var left = elem("div", "seats-col");
    sides.left.slice().reverse().forEach(function(i){ left.appendChild(seatNode(i, "s-wide")); });
    left.style.paddingRight = "var(--side-pad)";
    g.appendChild(place(left, 3, 1, 4, 2));

    var deskLeft = elem("div", "desk grain-v");
    deskLeft.style.width = thickness;
    deskLeft.style.borderTop = "none";
    deskLeft.style.borderRight = "none";
    deskLeft.style.borderRadius = closed ? "0" : "0 0 0 10px";
    if (closed) deskLeft.style.borderBottom = "none";
    g.appendChild(place(deskLeft, 3, 2, 4, 3));

    var court = elem("div", "court");
    court.appendChild(elem("span", "court-label", "中央スペース"));
    g.appendChild(place(court, 3, 3, 4, 4));

    var deskRight = elem("div", "desk grain-v");
    deskRight.style.width = thickness;
    deskRight.style.borderTop = "none";
    deskRight.style.borderLeft = "none";
    deskRight.style.borderRadius = closed ? "0" : "0 0 10px 0";
    if (closed) deskRight.style.borderBottom = "none";
    g.appendChild(place(deskRight, 3, 4, 4, 5));

    var right = elem("div", "seats-col");
    sides.right.forEach(function(i){ right.appendChild(seatNode(i, "s-wide")); });
    right.style.paddingLeft = "var(--side-pad)";
    g.appendChild(place(right, 3, 5, 4, 6));

    if (closed){
      var deskBottom = elem("div", "desk grain-h");
      deskBottom.style.height = thickness;
      deskBottom.style.borderRadius = "0 0 10px 10px";
      deskBottom.style.borderTop = "none";
      g.appendChild(place(deskBottom, 4, 2, 5, 5));

      var bottom = elem("div", "seats-row");
      sides.bottom.forEach(function(i){ bottom.appendChild(seatNode(i, "s-tall")); });
      bottom.style.paddingTop = "var(--side-pad)";
      g.appendChild(place(bottom, 5, 2, 6, 5));
    }
    root.appendChild(g);
  }

  // Android などで振動に対応している場合の軽いフィードバック（iOS では無視される）
  function tap(ms){
    if (navigator.vibrate) { try{ navigator.vibrate(ms); }catch(e){} }
  }

  // 見取り図は枠に合わせて縮むので、画面の広さにかかわらず既定は見取り図
  function defaultView(){ return "map"; }

  function shuffle(a){
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- 保存 ---------- */
  function save(){
    try{
      localStorage.setItem(STORE, JSON.stringify({
        names:state.names, layout:state.layout, cfg:state.cfg, pins:state.pins,
        assign:state.assign, drawnAt:state.drawnAt,
        view:state.view, viewChosen:state.viewChosen
      }));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (Array.isArray(d.names)) state.names = d.names;
      if (LAYOUTS[d.layout]) state.layout = d.layout;
      if (d.cfg && typeof d.cfg === "object"){
        // 保存が古くて足りない項目があっても既定値で埋める
        for (var k in DEFAULT_CFG){
          if (DEFAULT_CFG.hasOwnProperty(k) && typeof d.cfg[k] === "number") state.cfg[k] = d.cfg[k];
        }
      }
      if (d.pins && typeof d.pins === "object") state.pins = d.pins;
      if (Array.isArray(d.assign)) state.assign = d.assign;
      if (typeof d.drawnAt === "string") state.drawnAt = d.drawnAt;
      if (d.viewChosen === true && (d.view === "map" || d.view === "list")){
        state.view = d.view;
        state.viewChosen = true;
      }
    }catch(e){}
  }

  /* ---------- 入力の正規化 ---------- */
  function readNames(){
    return el.names.value.split(/\r?\n/).map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length > 0; });
  }
  function cleanPins(){
    var n = total(), out = {};
    var takenSeat = {};
    Object.keys(state.pins).forEach(function(name){
      var s = state.pins[name];
      if (state.names.indexOf(name) === -1) return;   // 参加者から消えた
      if (typeof s !== "number" || s < 0 || s >= n) return; // 席が消えた
      if (takenSeat[s]) return;                        // 席の重複
      takenSeat[s] = true;
      out[name] = s;
    });
    state.pins = out;
  }
  function duplicates(list){
    var seen = {}, dup = [];
    list.forEach(function(n){
      if (seen[n] && dup.indexOf(n) === -1) dup.push(n);
      seen[n] = true;
    });
    return dup;
  }

  /* ---------- 抽選 ---------- */
  function computeAssignment(){
    var n = total();
    var result = new Array(n).fill(null);
    var used = {};
    Object.keys(state.pins).forEach(function(name){
      result[state.pins[name]] = name;
      used[name] = true;
    });
    var rest = shuffle(state.names.filter(function(nm){ return !used[nm]; }));
    for (var i=0;i<n && rest.length;i++){
      if (result[i] === null) result[i] = rest.shift();
    }
    return result;
  }

  var rolling = false;
  function draw(){
    if (rolling) return;
    var problem = validate();
    if (problem){ setNotice(problem, true); return; }

    var final = computeAssignment();
    state.drawnAt = stamp();
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduce){
      state.assign = final;
      renderRoom(); renderStats(); save();
      setNotice("抽選しました。席を" + TAP + "すると固定できます。");
      return;
    }

    rolling = true;
    el.drawBtn.disabled = true;
    var free = [];
    for (var i=0;i<final.length;i++){
      if (!isPinnedSeat(i)) free.push(i);
    }
    var pool = state.names.slice();
    var seatsEls = {};
    state.assign = final.slice();
    renderRoom();
    // 見取り図と席順リストの両方に同じ席番号のノードがあるので、まとめて動かす
    free.forEach(function(i){
      var nodes = [].slice.call(el.plan.querySelectorAll('[data-seat="'+i+'"]'));
      seatsEls[i] = nodes;
      nodes.forEach(function(n){ n.classList.add("is-rolling"); });
    });

    var ticks = 0;
    var spin = setInterval(function(){
      ticks++;
      free.forEach(function(i){
        var pick = pool[Math.floor(Math.random()*pool.length)] || "空席";
        seatsEls[i].forEach(function(n){ n.querySelector(".who").textContent = pick; });
      });
      if (ticks > 14){
        clearInterval(spin);
        free.forEach(function(i, k){
          setTimeout(function(){
            seatsEls[i].forEach(function(n){
              n.classList.remove("is-rolling");
              n.classList.add("is-landed");
              n.querySelector(".who").textContent = final[i] || "空席";
              if (!final[i]) n.classList.add("is-empty");
            });
            tap(6);
          }, k * 55);
        });
        setTimeout(function(){
          rolling = false;
          el.drawBtn.disabled = false;
          renderRoom(); renderStats(); save();
          setNotice("抽選しました。席を" + TAP + "すると固定できます。");
        }, free.length * 55 + 260);
      }
    }, 62);
  }

  function isPinnedSeat(i){
    return Object.keys(state.pins).some(function(nm){ return state.pins[nm] === i; });
  }

  function stamp(){
    var d = new Date();
    var p = function(x){ return String(x).padStart(2,"0"); };
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }

  function validate(){
    if (state.names.length === 0) return "参加者の名前を入力すると抽選できます。";
    if (total() === 0) return "席が0です。上辺・左辺・右辺の数を設定してください。";
    if (state.names.length > total()) {
      return "参加者" + state.names.length + "名に対して席が" + total() + "しかありません。席数を増やしてください。";
    }
    var dup = duplicates(state.names);
    if (dup.length) return "同じ名前があります（" + dup.join("、") + "）。区別できる表記にしてください。";
    return null;
  }

  function setNotice(msg, isError){
    el.notice.textContent = msg || "";
    el.notice.classList.toggle("is-error", !!isError);
  }

  /* ---------- 描画 ---------- */
  function seatNode(i, sizeClass){
    var name = state.assign[i] || null;
    var pinned = name && state.pins[name] === i;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "seat " + (sizeClass || "s-cell") + (name ? "" : " is-empty") + (pinned ? " is-pinned" : "");
    b.dataset.seat = String(i);
    b.setAttribute("aria-label", seatLabel(i) + "：" + (name || "空席") + (pinned ? "（固定）" : ""));

    var no = document.createElement("span");
    no.className = "no";
    no.textContent = seatNo(i);

    var who = document.createElement("span");
    who.className = "who";
    who.textContent = name || "空席";

    b.appendChild(no);
    b.appendChild(who);
    if (pinned){
      var m = document.createElement("span");
      m.className = "pin-mark";
      m.textContent = "固定";
      b.appendChild(m);
    }
    return b;
  }

  function renderRoom(){
    var n = total();
    if (state.assign.length !== n) state.assign = new Array(n).fill(null);

    var lay = layout();
    el.room.innerHTML = "";
    // 折り返す並びは枠幅いっぱい、それ以外は中身の幅（入りきらなければ枠内で横スクロール）
    el.room.style.width = (lay.fit === "wrap") ? "100%" : "max-content";

    // 前方（上座・黒板）の見出し
    var top = elem("div", "room-top");
    if (lay.topBar.kind === "bar") top.appendChild(elem("div", "board", lay.topBar.text));
    else top.appendChild(elem("span", "badge-kamiza", lay.topBar.text));
    el.room.appendChild(top);

    lay.render(el.room, state.cfg);

    el.room.appendChild(elem("div", "room-bottom", lay.bottomBar));
    el.room.appendChild(elem("div", "room-stamp",
      state.drawnAt ? ("抽選 " + state.drawnAt) : "未抽選"));

    renderRoster();
    applyView();
  }

  function renderRoster(){
    el.roster.innerHTML = "";
    var lastSide = "";
    for (var i = 0; i < total(); i++){
      var meta = seatSide(i);
      if (meta.group !== lastSide){
        var h = document.createElement("div");
        h.className = "roster-group";
        h.textContent = meta.group;
        el.roster.appendChild(h);
        lastSide = meta.group;
      }
      el.roster.appendChild(rosterRow(i, meta));
    }
  }

  function rosterRow(i, meta){
    var name = state.assign[i] || null;
    var pinned = name && state.pins[name] === i;

    var row = document.createElement("button");
    row.type = "button";
    row.className = "seat-row" + (name ? "" : " is-empty") + (pinned ? " is-pinned" : "");
    row.dataset.seat = String(i);
    row.setAttribute("aria-label", seatLabel(i) + "：" + (name || "空席") + (pinned ? "（固定）" : ""));

    var no = document.createElement("span");
    no.className = "no";
    no.textContent = seatNo(i);

    var side = document.createElement("span");
    side.className = "side";
    side.textContent = meta.group + meta.pos;

    var who = document.createElement("span");
    who.className = "who";
    who.textContent = name || "空席";

    row.appendChild(no);
    row.appendChild(side);
    row.appendChild(who);
    if (pinned){
      var m = document.createElement("span");
      m.className = "pin-mark";
      m.textContent = "固定";
      row.appendChild(m);
    }
    return row;
  }

  // 見取り図が枠に入りきらないときは、はみ出さずに全体を縮めて収める。
  // スマホでは画面の高さにも合わせるので、スクロールせずに全体が見える。
  function fitMap(){
    var room = el.room, fit = el.roomFit;
    fit.classList.remove("is-scaled");
    room.style.transform = "";
    fit.style.height = "";
    if (state.view !== "map") return;

    var avail = fit.clientWidth;
    var natW = room.scrollWidth, natH = room.scrollHeight;
    if (!avail || !natW || !natH) return;

    var k = Math.min(1, avail / natW);

    // 狭い画面では、下にスクロールしなくても全体が見えるように高さも見る
    if (document.documentElement.getAttribute("data-w") === "narrow"){
      var topOnPage = fit.getBoundingClientRect().top + (window.scrollY || 0);
      var availH = window.innerHeight - topOnPage - 44;   // 44 は図の下の注記ぶん
      if (availH > 140) k = Math.min(k, availH / natH);
    }

    if (k >= 0.999) return;
    fit.classList.add("is-scaled");
    room.style.transformOrigin = "top left";
    room.style.transform = "translateX(" + ((avail - natW * k) / 2) + "px) scale(" + k + ")";
    fit.style.height = Math.ceil(natH * k) + "px";
  }

  function applyView(){
    var isList = state.view === "list";
    el.roomScroll.hidden = isList;
    el.roster.hidden = !isList;
    el.viewMap.setAttribute("aria-pressed", String(!isList));
    el.viewList.setAttribute("aria-pressed", String(isList));
    fitMap();
  }

  function setView(v){
    state.view = v;
    state.viewChosen = true;
    applyView();
    save();
  }

  function renderStats(){
    var n = total();
    var filled = state.assign.filter(function(x){ return !!x; }).length;
    el.statSeats.textContent = n;
    el.statPeople.textContent = state.names.length;
    el.statPins.textContent = Object.keys(state.pins).length;
    el.statEmpty.textContent = Math.max(0, n - filled);
    el.nameCount.textContent = state.names.length === 0
      ? "参加者が未入力です"
      : state.names.length + "名を入力中";
    var detail = layout().fields.map(function(f){ return f.label + state.cfg[f.key]; }).join("・");
    el.seatCount.textContent = "合計 " + n + " 席（" + detail + "）";
  }

  var pendingPin = null;   // 入力中の固定席（人か席のどちらかだけ選んだ状態）

  // 選んだレイアウトに必要な数値入力だけを出し直す
  function renderLayoutFields(){
    var lay = layout();
    el.layoutNote.textContent = lay.note;
    el.orderNote.textContent = lay.order;
    el.cfgFields.innerHTML = "";
    el.cfgFields.style.gridTemplateColumns = "repeat(" + Math.min(lay.fields.length, 4) + ", 1fr)";

    lay.fields.forEach(function(f){
      var label = elem("label", null, null);
      label.appendChild(document.createTextNode(f.label));
      var input = document.createElement("input");
      input.type = "number";
      input.min = f.min; input.max = f.max;
      input.value = state.cfg[f.key];
      input.addEventListener("change", function(){
        var v = parseInt(input.value, 10);
        if (isNaN(v) || v < f.min) v = f.min;
        if (v > f.max) v = f.max;
        input.value = v;
        state.cfg[f.key] = v;
        resizeSeats();
      });
      label.appendChild(input);
      el.cfgFields.appendChild(label);
    });
  }

  // 席数が変わったら、割り当てはやり直しになる
  function resizeSeats(){
    state.assign = new Array(total()).fill(null);
    state.pins = {};
    state.drawnAt = null;
    pendingPin = null;
    refresh();
  }

  function renderPins(){
    el.pinList.innerHTML = "";
    var entries = Object.keys(state.pins).map(function(nm){ return [nm, state.pins[nm]]; });
    entries.sort(function(a,b){ return a[1] - b[1]; });

    if (!entries.length && !pendingPin){
      var p = document.createElement("p");
      p.className = "pin-empty";
      p.textContent = "固定席はありません。";
      el.pinList.appendChild(p);
    }
    entries.forEach(function(e){ el.pinList.appendChild(pinRow(e[0], e[1], false)); });
    if (pendingPin) el.pinList.appendChild(pinRow(pendingPin.name, pendingPin.seat, true));
  }

  function pinRow(name, seat, isPending){
    var row = document.createElement("div");
    row.className = "pin-row";

    var who = document.createElement("select");
    who.setAttribute("aria-label", "固定する人");
    who.appendChild(new Option("— 人を選ぶ —", ""));
    state.names.forEach(function(nm){
      var o = new Option(nm, nm);
      if (nm === name) o.selected = true;
      who.appendChild(o);
    });

    var where = document.createElement("select");
    where.setAttribute("aria-label", "固定する席");
    where.appendChild(new Option("— 席を選ぶ —", ""));
    for (var i = 0; i < total(); i++){
      var o2 = new Option(seatLabel(i), String(i));
      if (seat === i) o2.selected = true;
      where.appendChild(o2);
    }

    var del = document.createElement("button");
    del.type = "button";
    del.className = "btn btn-icon";
    del.textContent = "削除";
    del.setAttribute("aria-label", (name || "この") + "の固定席を削除");

    function apply(){
      var nm = who.value;
      var sv = where.value === "" ? null : parseInt(where.value, 10);

      if (!isPending && name) delete state.pins[name];

      if (nm && sv !== null){
        // 同じ席に別の人が固定されていたら、その固定を解除して入れ替える
        Object.keys(state.pins).forEach(function(k){ if (state.pins[k] === sv) delete state.pins[k]; });
        state.pins[nm] = sv;
        applyPinsToAssignment();
        pendingPin = null;
        setNotice(nm + " さんを " + seatLabel(sv) + " に固定しました。");
      } else {
        // まだ片方だけ。入力途中の状態として保持する
        pendingPin = { name: nm, seat: sv };
      }
      refresh();
    }

    who.addEventListener("change", apply);
    where.addEventListener("change", apply);
    del.addEventListener("click", function(){
      if (isPending) pendingPin = null;
      else if (name) delete state.pins[name];
      refresh();
    });

    row.appendChild(who);
    row.appendChild(where);
    row.appendChild(del);
    return row;
  }

  // 固定を変更したら、その席の中身を固定者に合わせて入れ替える
  function applyPinsToAssignment(){
    var n = total();
    if (state.assign.length !== n) return;
    Object.keys(state.pins).forEach(function(nm){
      var s = state.pins[nm];
      if (state.assign[s] === nm) return;
      var cur = state.assign.indexOf(nm);
      var displaced = state.assign[s];
      state.assign[s] = nm;
      if (cur !== -1) state.assign[cur] = displaced;
    });
  }

  function refresh(){
    cleanPins();
    renderLayoutFields();
    renderRoom();
    renderPins();
    renderStats();
    save();
    var problem = validate();
    // 未入力はまだ何も間違っていないので、赤い警告ではなく案内として出す
    if (problem) setNotice(problem, state.names.length > 0);
    else if (el.notice.classList.contains("is-error")) setNotice("");
    el.drawBtn.disabled = !!problem;
  }

  /* ---------- イベント ---------- */
  el.names.addEventListener("input", function(){
    state.names = readNames();
    refresh();
  });

  el.layoutSelect.addEventListener("change", function(){
    if (!LAYOUTS[el.layoutSelect.value]) return;
    state.layout = el.layoutSelect.value;
    // 席の位置の意味が変わるので、固定席は引き継がずに解除する
    resizeSeats();
    setNotice("並びを「" + layout().name + "」にしました。固定席は解除しています。");
  });

  el.plan.addEventListener("click", function(ev){
    var node = ev.target.closest ? ev.target.closest("[data-seat]") : null;
    if (!node || rolling) return;
    var i = parseInt(node.dataset.seat,10);
    var name = state.assign[i];
    if (!name){ setNotice("空席は固定できません。先に抽選してください。", true); return; }
    if (state.pins[name] === i){
      delete state.pins[name];
      setNotice(name + " さんの固定を解除しました。");
    } else {
      Object.keys(state.pins).forEach(function(k){ if (state.pins[k] === i) delete state.pins[k]; });
      delete state.pins[name];
      state.pins[name] = i;
      setNotice(name + " さんを " + seatLabel(i) + " に固定しました。次の抽選でもこの席のままです。");
      tap(12);
    }
    pendingPin = null;
    refresh();
  });

  el.addPin.addEventListener("click", function(){
    if (Object.keys(state.pins).length >= total()) return;
    if (!pendingPin) pendingPin = { name: "", seat: null };
    renderPins();
  });

  window.addEventListener("resize", fitMap);
  window.addEventListener("orientationchange", function(){ setTimeout(fitMap, 250); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMap);

  window.addEventListener("resize", function(){
    if (state.viewChosen) return;
    var next = defaultView();
    if (next !== state.view){ state.view = next; applyView(); }
  });

  el.viewMap.addEventListener("click", function(){ setView("map"); });
  el.viewList.addEventListener("click", function(){ setView("list"); });

  el.drawBtn.addEventListener("click", draw);

  el.copyBtn.addEventListener("click", function(){
    var text = asText();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        setNotice("座席表をコピーしました。");
      }, function(){ fallbackCopy(text); });
    } else fallbackCopy(text);
  });

  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); setNotice("座席表をコピーしました。"); }
    catch(e){ setNotice("コピーできませんでした。手動で選択してください。", true); }
    document.body.removeChild(ta);
  }

  function asText(){
    var lines = ["座席表（" + layout().name + " / " + total() + "席）"];
    lines.push(state.drawnAt ? "抽選 " + state.drawnAt : "未抽選");
    lines.push("");
    var lastSide = "";
    for (var i=0;i<total();i++){
      var s = seatSide(i);
      if (s.group !== lastSide){ lines.push("[" + s.group + "]"); lastSide = s.group; }
      var nm = state.assign[i] || "空席";
      var pinned = state.assign[i] && state.pins[state.assign[i]] === i;
      lines.push("  " + seatNo(i) + "  " + nm + (pinned ? "（固定）" : ""));
    }
    return lines.join("\n");
  }

  el.printBtn.addEventListener("click", function(){ window.print(); });

  // 席だけ空にする。参加者リストはそのまま残すので、すぐ抽選し直せる
  el.clearSeatsBtn.addEventListener("click", function(){
    if (rolling) return;
    state.assign = new Array(total()).fill(null);
    state.pins = {};
    state.drawnAt = null;
    pendingPin = null;
    refresh();
    setNotice("席をクリアしました。固定席も解除しています。");
  });

  // 参加者リストごと空にする
  el.clearAllBtn.addEventListener("click", function(){
    if (rolling) return;
    state.names = [];
    state.pins = {};
    state.assign = new Array(total()).fill(null);
    state.drawnAt = null;
    pendingPin = null;
    syncInputs();
    refresh();
    setNotice("参加者と席を空にしました。名前を入力してください。");
  });

  function syncInputs(){
    el.names.value = state.names.join("\n");
    el.layoutSelect.value = state.layout;
  }

  function buildLayoutSelect(){
    el.layoutSelect.innerHTML = "";
    for (var key in LAYOUTS){
      if (LAYOUTS.hasOwnProperty(key)) el.layoutSelect.appendChild(new Option(LAYOUTS[key].name, key));
    }
  }

  /* ---------- オフライン対応（http/https で配信したときだけ） ---------- */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* 配信していない場合は何もしない */ });
    });
  }

  /* ---------- 起動 ---------- */
  [].forEach.call(document.querySelectorAll(".tapword"), function(n){ n.textContent = TAP; });
  buildLayoutSelect();
  load();
  syncInputs();
  refresh();
})();
</script>
